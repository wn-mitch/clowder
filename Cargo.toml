[package]
name = "clowder"
version = "0.3.0"
edition = "2021"
description = "A terminal-based colony simulation"
license-file = "LICENSE"
default-run = "clowder"

[dependencies]
bevy = "0.18"
bevy_ecs_tilemap = "0.18"
bevy_ecs = "0.18"

# Ticket 438 — distributed-slice auto-discovery for cat-DSE
# registrations. Each `src/ai/dses/*.rs` self-registers its DSE via
# `#[linkme::distributed_slice(CAT_DSE_REGISTRY)]`; the central
# `populate_dse_registry` reads the slice (sorted by declared dispatch
# order) and constructs DSEs in seed-42 sequence. Eliminates the
# parallel hand-maintained list that was the silent-failure surface
# diagnosed by tickets 436 / 437. Order numbers are declared inline
# at each registration site, gapped by 100 so future inserts don't
# have to renumber.
linkme = "0.3"

rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
noise = "0.9"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[lints.rust]
# `deny` (not `forbid`) is mandatory for binary crates: cargo's test harness
# auto-wraps `fn main` with `#[allow(dead_code)]` when building the
# `bin "<name>" test` target, since the harness replaces `main` and the
# user's `main` becomes unused. `forbid` rejects that synthesized allow.
dead_code = "deny"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Ticket 430 — release-equivalent build + symbol info for sampling
# profilers (samply, cargo flamegraph). Production builds keep
# `--release` (stripped); perf investigations use `--profile
# profiling`. `split-debuginfo = "packed"` is load-bearing on macOS:
# rustc emits a `.dSYM` bundle at link time (before per-object debug
# files are cleaned). `"off"` does NOT embed DWARF in the executable
# on macOS — it just skips the split step, leaving symbols in
# transient object files. samply auto-discovers the sibling
# `<binary>.dSYM` bundle and symbolicates from it.
[profile.profiling]
inherits = "release"
debug = true
strip = false
split-debuginfo = "packed"
